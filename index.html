<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E7CB1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>동물 타일매치 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile-w:54px; --tile-h:62px;
  --bg1:#EAF4FD; --bg2:#B7D5EE; --bg3:#8FBADD;
  --panel:#FFFFFFCC; --chip:#FFFFFFAA; --line:#7BA6CC66;
  --text:#22384E; --dim:#5E7C97;
  --face1:#FFFDF6; --face2:#F3E6CB; --edge:#CFA96F;
  --accent:#3E7CB1; --danger:#D2564C; --good:#3E9E85;
  --glow:#FFFFFF88;
  --spark1:#FFD166; --spark2:#EF8354; --spark3:#4FB0C6; --spark4:#FFFFFF;
}
body[data-theme="meadow"]{
  --bg1:#F3FAE9; --bg2:#CDE7BE; --bg3:#A9D398;
  --panel:#FFFFFFCC; --chip:#FFFFFFAA; --line:#7FAE6E66;
  --text:#2C4630; --dim:#5F8560;
  --face1:#FFFEF7; --face2:#F1E5C6; --edge:#C7A468;
  --accent:#4E8F58; --danger:#CF5F45; --good:#3E9E85;
  --glow:#FFFFFF99;
  --spark1:#FFE07A; --spark2:#F2954B; --spark3:#7ED09A; --spark4:#FFFFFF;
}
body[data-theme="moon"]{
  --bg1:#1B2C46; --bg2:#111B2C; --bg3:#0B1220;
  --panel:#1C2C46E6; --chip:#FFFFFF12; --line:#C9A45C44;
  --text:#EADFC8; --dim:#94A5BE;
  --face1:#FBF3E0; --face2:#DFCCA5; --edge:#B08F4E;
  --accent:#C9A45C; --danger:#C4453C; --good:#3E9E85;
  --glow:#C9A45C33;
  --spark1:#FFD98A; --spark2:#E2725B; --spark3:#8FD3E8; --spark4:#FFF6E0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed;
  color:var(--text);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;user-select:none;transition:background .4s ease,color .3s ease;
  touch-action:manipulation;
}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:10px 12px 14px}
.app.jolt{animation:jolt .26s ease-out}
@keyframes jolt{
  0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
  50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}
}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 10px}
.brand{font-family:'Gowun Batang',serif;font-size:18px;letter-spacing:.04em}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
.row{display:flex;gap:5px;align-items:center;margin-top:6px}
.swatch{width:19px;height:19px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 1px 3px #0003}
.swatch[aria-pressed="true"]{border-color:var(--text)}
.sw-sky{background:linear-gradient(140deg,#EAF4FD,#8FBADD)}
.sw-meadow{background:linear-gradient(140deg,#F3FAE9,#A9D398)}
.sw-moon{background:linear-gradient(140deg,#33507E,#0B1220)}
#btnSound,#btnMusic{
  width:24px;height:19px;border:none;background:none;cursor:pointer;font-size:13px;
  color:var(--dim);padding:0;line-height:1;
}
#btnSound{margin-left:3px}
#btnMusic.off,#btnSound.off{opacity:.35}
#btnMusic.missing{opacity:.2;cursor:not-allowed}
.stats{display:flex;gap:6px}
.stat{min-width:60px;padding:6px 8px;border-radius:10px;text-align:center;background:var(--chip);border:1px solid var(--line)}
.stat b{display:block;font-family:'Gowun Batang',serif;font-size:17px;line-height:1.15}
.stat span{font-size:9px;letter-spacing:.16em;color:var(--dim)}
.stat.warn b{color:var(--danger)}
.stat.bump b{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3);color:var(--good)}100%{transform:scale(1)}}

#boardWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1100px;min-height:0}
#boardWrap::before{
  content:"";position:absolute;width:80%;height:62%;border-radius:50%;
  background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;
}
#board{position:relative;width:351px;height:310px;transform-origin:center center}
.tile{
  position:absolute;width:var(--tile-w);height:var(--tile-h);
  border-radius:9px;border:1px solid #2A211826;
  background:linear-gradient(168deg,var(--face1) 0%,var(--face2) 100%);
  box-shadow:0 4px 0 var(--edge), 0 5px 9px #0000004d, inset 0 1px 0 #ffffffb3;
  display:flex;align-items:center;justify-content:center;
  line-height:1;cursor:pointer;
  transition:filter .15s ease,opacity .15s ease,transform .08s ease;
}
.tile svg{width:38px;height:38px;position:relative;z-index:1;pointer-events:none;display:block}
.tile::after{
  content:"";position:absolute;inset:1px;border-radius:8px;pointer-events:none;
  background:linear-gradient(122deg,#ffffff8c 0 16%,transparent 40%);opacity:.55;
}
.tile.pressed{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--edge),0 2px 5px #0000004d}
.tile.blocked{filter:brightness(.62) saturate(.55) contrast(.95);cursor:default}
.tile.shake{animation:shake .26s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-5px}75%{margin-left:5px}}

#tray{
  margin-top:8px;padding:9px 8px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 6px 16px #0000002e;
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:relative;
}
.slot{aspect-ratio:54/62;border-radius:8px;border:1px dashed var(--line);position:relative}
.slot .face{
  position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(168deg,var(--face1),var(--face2));
  border:1px solid #2A211826;box-shadow:0 2px 0 var(--edge);
  display:flex;align-items:center;justify-content:center;
}
.slot .face svg{width:26px;height:26px;display:block}
.slot .face.pop{animation:pop .24s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot .face.ready{animation:ready .5s ease-in-out infinite alternate}
@keyframes ready{from{box-shadow:0 2px 0 var(--edge)}to{box-shadow:0 2px 0 var(--edge),0 0 12px 2px var(--spark1)}}
.slot .face.clearing{animation:clear .3s ease-in forwards}
@keyframes clear{40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(.2) rotate(20deg);opacity:0}}
#tray.danger{border-color:var(--danger);box-shadow:0 0 0 1px #d2564c55,0 6px 16px #0000002e}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tool{
  padding:10px 4px;border-radius:12px;border:1px solid var(--line);
  background:var(--chip);color:var(--text);font-family:inherit;font-size:12px;cursor:pointer;position:relative;
}
.tool:disabled{opacity:.4;cursor:default}
.tool b{display:block;font-size:15px;margin-bottom:3px;font-family:'Gowun Batang',serif}
.tool .n{
  position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;
  background:var(--good);color:#fff;font-size:11px;line-height:20px;text-align:center;
}
.tool:focus-visible,.btn:focus-visible,.tile:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ══ 콤보 미터 ══ */
#comboWrap{
  height:0;overflow:hidden;opacity:0;transition:height .18s ease,opacity .18s ease;
  margin:0 2px;
}
#comboWrap.on{height:26px;opacity:1;margin-bottom:4px}
.comboTop{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--dim)}
#comboLabel{
  font-family:'Gowun Batang',serif;font-weight:700;font-size:14px;color:var(--spark2);
  letter-spacing:.06em;text-shadow:0 0 10px var(--spark1);
}
#comboLabel.hit{animation:cpunch .3s ease-out}
@keyframes cpunch{0%{transform:scale(1.6);color:var(--spark1)}100%{transform:scale(1)}}
.comboTrack{height:5px;border-radius:3px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin-top:3px}
#comboFill{
  height:100%;width:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--spark3),var(--spark1),var(--spark2));
  transition:width .1s linear;
}

/* ══ 콤보 배너 ══ */
#banner{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:75;pointer-events:none;
  font-family:'Gowun Batang',serif;font-weight:700;text-align:center;display:none;white-space:nowrap;
}
#banner.on{display:block;animation:bannerIn .95s ease-out forwards}
#banner .big{
  font-size:52px;line-height:1;color:var(--spark1);
  text-shadow:0 3px 0 #00000055,0 0 24px var(--spark1),0 0 46px var(--spark2);
}
#banner .sub{font-size:15px;letter-spacing:.3em;color:var(--spark4);margin-top:4px;text-shadow:0 0 12px var(--spark2)}
@keyframes bannerIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(3deg)}
  32%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-90%) scale(1.1)}
}

/* ══ 라운드 전환 플래시 ══ */
#flash{
  position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,#fff,transparent 70%);
}
#flash.on{animation:flashOut .7s ease-out}
@keyframes flashOut{0%{opacity:.85}100%{opacity:0}}

/* ══ 리더보드 ══ */
#btnBoard{
  width:24px;height:19px;border:none;background:none;cursor:pointer;font-size:13px;
  color:var(--dim);padding:0;line-height:1;
}
.lb{margin:0 0 16px;text-align:left;max-height:230px;overflow-y:auto}
.lbRow{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:13px;margin-bottom:4px;background:var(--chip);border:1px solid transparent;
}
.lbRow.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lbRow .rk{width:22px;font-family:'Gowun Batang',serif;font-weight:700;color:var(--dim);text-align:center}
.lbRow.top1 .rk,.lbRow.top2 .rk,.lbRow.top3 .rk{color:var(--spark2);font-size:15px}
.lbRow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbRow .sc{font-family:'Gowun Batang',serif;font-weight:700}
.lbRow .lv{font-size:10px;color:var(--dim);margin-left:4px}
.lbEmpty{font-size:12.5px;color:var(--dim);padding:18px 0;text-align:center}
.lbNote{font-size:11px;color:var(--dim);margin:0 0 8px;text-align:center}
.loadNote .tiny{font-size:11px;opacity:.7}

/* ══ 스테이지 클리어 연출 ══ */
#stageFX{position:fixed;inset:0;z-index:85;pointer-events:none;display:none;overflow:hidden}
#stageFX.on{display:block}
.sweep{
  position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,var(--spark4),var(--spark1),transparent);
  opacity:.5;filter:blur(2px);animation:sweepGo .85s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes sweepGo{to{left:120%}}
.curtain{
  position:absolute;left:0;width:100%;height:52%;
  background:linear-gradient(180deg,var(--bg3),var(--bg2));box-shadow:0 0 40px #0006;
}
.curtain.t{top:0;animation:curtT 1.9s cubic-bezier(.5,0,.3,1) forwards}
.curtain.b{bottom:0;animation:curtB 1.9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes curtT{0%{transform:translateY(-100%)}28%,64%{transform:translateY(0)}100%{transform:translateY(-100%)}}
@keyframes curtB{0%{transform:translateY(100%)}28%,64%{transform:translateY(0)}100%{transform:translateY(100%)}}
.stageWord{
  position:absolute;left:50%;top:50%;text-align:center;
  font-family:'Gowun Batang',serif;opacity:0;animation:wordIn 1.9s ease-out forwards;
}
.stageWord .k{font-size:15px;letter-spacing:.5em;color:var(--spark1);margin-bottom:6px;text-shadow:0 0 16px var(--spark1)}
.stageWord .n{font-size:64px;font-weight:700;line-height:1;color:var(--text);text-shadow:0 4px 0 #00000033,0 0 34px var(--spark1)}
.stageWord .s{font-size:13px;letter-spacing:.24em;color:var(--dim);margin-top:8px}
@keyframes wordIn{
  0%,20%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  36%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  46%,62%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  76%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
}
.stampWrap{position:absolute;left:50%;top:38%;animation:stampIn 1.3s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp{
  font-family:'Gowun Batang',serif;font-size:38px;font-weight:700;
  color:var(--danger);border:5px solid var(--danger);border-radius:14px;
  padding:10px 24px;transform:rotate(-14deg);opacity:.94;box-shadow:0 0 0 3px #ffffff44 inset;
}
@keyframes stampIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(3.4) rotate(6deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  30%{transform:translate(-50%,-50%) scale(1.08)}
  40%,78%{transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}
}
/* 결과 집계 */
.tally{margin:0 0 14px}
.tallyRow{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 11px;border-radius:10px;background:var(--chip);
  margin-bottom:6px;font-size:13.5px;opacity:0;animation:tallyIn .4s ease-out forwards;
}
.tallyRow:nth-child(1){animation-delay:.05s}
.tallyRow:nth-child(2){animation-delay:.3s}
.tallyRow:nth-child(3){animation-delay:.55s}
.tallyRow:nth-child(4){animation-delay:.8s}
.tallyRow.total{background:transparent;border-top:1px dashed var(--line);border-radius:0;margin-top:8px;padding-top:12px}
.tallyRow .lab{color:var(--dim)}
.tallyRow .val{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px}
.tallyRow.total .val{font-size:22px;color:var(--spark2)}
@keyframes tallyIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
/* 다음 단계 미리보기 */
.nextInfo{display:flex;gap:8px;margin:0 0 14px}
.nextInfo div{flex:1;padding:9px 6px;border-radius:10px;background:var(--chip);border:1px solid var(--line);text-align:center}
.nextInfo b{display:block;font-family:'Gowun Batang',serif;font-size:17px;margin-bottom:2px}
.nextInfo span{font-size:10px;color:var(--dim);letter-spacing:.08em}
.rewardRow{display:flex;justify-content:center;gap:14px;margin:0 0 14px;font-size:12.5px;color:var(--dim)}
.rewardRow em{font-style:normal;color:var(--good);font-weight:700}

/* ══ 보너스 스테이지: 골든 타일 러시 ══ */
body.bonus{
  background:radial-gradient(120% 80% at 50% 0%, #FFF6DC 0%, #FFD98A 45%, #E8A93C 100%) fixed;
}
body.bonus .tile{
  background:linear-gradient(168deg,#FFFBEB 0%,#FFE9A8 55%,#F5CE6A 100%);
  box-shadow:0 4px 0 #C98F2E, 0 5px 12px #00000047, inset 0 1px 0 #fff;
  border-color:#8A63203d;
  animation:goldPulse 1.6s ease-in-out infinite alternate;
}
@keyframes goldPulse{
  from{box-shadow:0 4px 0 #C98F2E,0 5px 12px #00000047,inset 0 1px 0 #fff}
  to{box-shadow:0 4px 0 #C98F2E,0 5px 12px #00000047,inset 0 1px 0 #fff,0 0 16px 2px #FFD166aa}
}
body.bonus #tray{background:#FFFDF4E6;border-color:#D8A93Caa}
body.bonus .slot .face{background:linear-gradient(168deg,#FFFBEB,#F5CE6A);box-shadow:0 2px 0 #C98F2E}
body.bonus .stat,body.bonus .tool{background:#FFFFFFB3;border-color:#C98F2E55}
/* 보너스 전용 HUD */
#bonusBar{
  display:none;margin:0 2px 6px;padding:8px 11px;border-radius:12px;
  background:linear-gradient(90deg,#FFE9A8,#FFD166);
  border:1px solid #C98F2E66;color:#5A3E12;
  align-items:center;justify-content:space-between;font-size:12.5px;
}
#bonusBar.on{display:flex;animation:bbIn .3s ease-out}
@keyframes bbIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
#bonusBar b{font-family:'Gowun Batang',serif;font-size:15px}
#bonusBar .cleared{font-family:'Gowun Batang',serif;font-size:17px;font-weight:700}
/* 보너스 진입 연출 */
.goldSplash{
  position:absolute;left:50%;top:44%;text-align:center;
  font-family:'Gowun Batang',serif;opacity:0;
  animation:goldIn 2.1s ease-out forwards;
}
.goldSplash .k{
  font-size:14px;letter-spacing:.46em;color:#8A6320;margin-bottom:8px;
}
.goldSplash .n{
  font-size:44px;font-weight:700;line-height:1.1;color:#7A4E12;
  text-shadow:0 3px 0 #FFFFFF88,0 0 30px #FFD166;
}
.goldSplash .s{font-size:12.5px;letter-spacing:.14em;color:#8A6320;margin-top:10px;line-height:1.7}
@keyframes goldIn{
  0%,14%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-6deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(2deg)}
  40%,66%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}
}
.goldCurtain{
  position:absolute;left:0;width:100%;height:52%;
  background:linear-gradient(180deg,#F0BB55,#E8A93C);box-shadow:0 0 40px #0005;
}
.goldCurtain.t{top:0;animation:curtT 2.1s cubic-bezier(.5,0,.3,1) forwards}
.goldCurtain.b{bottom:0;animation:curtB 2.1s cubic-bezier(.5,0,.3,1) forwards}
/* 보너스 결과 강조 */
.bonusTotal{
  padding:14px;border-radius:12px;margin:0 0 14px;text-align:center;
  background:linear-gradient(135deg,#FFE9A8,#FFD166);border:1px solid #C98F2E66;
}
.bonusTotal b{display:block;font-family:'Gowun Batang',serif;font-size:30px;color:#7A4E12;line-height:1.1}
.bonusTotal span{font-size:11px;letter-spacing:.18em;color:#8A6320}

/* ══ 스테이지 맵 (윷놀이 말판) ══ */
#mapWrap{
  margin:0 0 16px;padding:14px 10px 10px;border-radius:14px;
  background:var(--chip);border:1px solid var(--line);
  position:relative;overflow:hidden;
}
.mapTitle{
  font-size:10.5px;letter-spacing:.22em;color:var(--dim);
  text-align:center;margin-bottom:12px;
}
.mapGrid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:9px 6px;position:relative;
}
/* 경로 연결선 */
.mapGrid::before{
  content:"";position:absolute;inset:14px 12px;
  border-radius:16px;pointer-events:none;
}
.node{
  position:relative;aspect-ratio:1;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--chip);border:1.5px solid var(--line);
  font-family:'Gowun Batang',serif;font-size:13px;font-weight:700;
  color:var(--dim);transition:transform .2s ease;
}
/* 칸 사이 잇는 점선 */
.node::after{
  content:"";position:absolute;right:-6px;top:50%;width:6px;height:1.5px;
  background:var(--line);
}
.node.rowEnd::after{
  right:auto;left:50%;top:auto;bottom:-9px;width:1.5px;height:9px;
}
.node.last::after{display:none}
/* 지나온 칸 */
.node.done{
  background:var(--good);border-color:var(--good);color:#fff;
}
.node.done .mark{font-size:15px}
/* 현재 칸 */
.node.now{
  background:var(--accent);border-color:var(--accent);color:#fff;
  transform:scale(1.16);z-index:2;
  box-shadow:0 0 0 3px var(--panel),0 4px 12px #0004;
  animation:nowPulse 1.5s ease-in-out infinite alternate;
}
@keyframes nowPulse{
  from{box-shadow:0 0 0 3px var(--panel),0 4px 12px #0004}
  to{box-shadow:0 0 0 3px var(--panel),0 4px 12px #0004,0 0 18px 3px var(--accent)}
}
/* 보너스 칸 */
.node.bonusNode{
  background:linear-gradient(140deg,#FFE9A8,#FFD166);
  border-color:#C98F2E;color:#7A4E12;font-size:17px;
}
.node.bonusNode.done{background:linear-gradient(140deg,#F0C97A,#D8A93C)}
.node.bonusNode.now{
  transform:scale(1.2);
  box-shadow:0 0 0 3px var(--panel),0 0 20px 4px #FFD166;
}
/* 막 마지막 칸 */
.node.finale{
  background:linear-gradient(140deg,#C9A9F0,#9B7BD4);
  border-color:#7A5CB8;color:#fff;font-size:16px;
}
.node.finale.done{background:linear-gradient(140deg,#A98FD0,#7A5CB8)}
.node.finale.now{transform:scale(1.2);box-shadow:0 0 0 3px var(--panel),0 0 20px 4px #9B7BD4}
/* 아직 안 간 칸 */
.node.todo{opacity:.5}
.node .lv{font-size:12px;line-height:1}
.node .tag{font-size:7.5px;letter-spacing:.06em;margin-top:2px;opacity:.85;font-weight:400}
/* 남은 판 수 안내 */
.mapHint{
  margin-top:11px;text-align:center;font-size:12px;color:var(--dim);
}
.mapHint b{color:var(--spark2);font-family:'Gowun Batang',serif;font-size:15px}
/* 지도 보기 버튼 */
#btnMap,#btnHelp,#btnHome{
  width:24px;height:19px;border:none;background:none;cursor:pointer;font-size:13px;
  color:var(--dim);padding:0;line-height:1;
}

/* ══ 코인 ══ */
.coinChip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;border-radius:11px;
  background:linear-gradient(135deg,#FFE9A8,#FFD166);
  border:1px solid #C98F2E77;color:#5A3E12;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:13px;
}
.coinChip.bump{animation:coinBump .4s ease-out}
@keyframes coinBump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
#hudCoins{
  position:absolute;top:8px;right:12px;z-index:5;
}
/* 부활 화면 */
.reviveHead{
  font-family:'Gowun Batang',serif;font-size:22px;margin:0 0 4px;color:var(--danger);
}
.reviveRing{
  width:96px;height:96px;margin:6px auto 14px;position:relative;
}
.reviveRing svg{transform:rotate(-90deg)}
.reviveRing .cnt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Gowun Batang',serif;font-size:34px;font-weight:700;color:var(--text);
}
.reviveRing circle{fill:none;stroke-width:7;stroke-linecap:round}
.reviveRing .bg{stroke:var(--line)}
.reviveRing .fg{stroke:var(--danger);transition:stroke-dashoffset 1s linear}
.reviveCost{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;color:var(--dim);margin-bottom:14px;
}
.btn.revive{
  background:linear-gradient(135deg,#FFD166,#F0A93C);color:#4A320C;
}
.btn.revive:disabled{opacity:.4;cursor:default;background:var(--chip);color:var(--dim)}
.earnRow{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 11px;border-radius:10px;background:var(--chip);
  margin-bottom:6px;font-size:12.5px;
}
.earnRow .v{font-family:'Gowun Batang',serif;font-weight:700;color:#B8860B}

/* ══ 튜토리얼 ══ */
#tutor{position:fixed;inset:0;z-index:88;display:none;pointer-events:none}
#tutor.on{display:block}
/* 어둡게 덮되 특정 영역만 뚫는다 */
#tutorMask{
  position:absolute;inset:0;background:#0B1A2ACC;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 0,transparent 0,#000 0);
  mask-image:radial-gradient(circle at 50% 50%,transparent 0,transparent 0,#000 0);
  transition:-webkit-mask-image .3s ease,mask-image .3s ease;
}
/* 강조 테두리 */
#tutorRing{
  position:absolute;border:3px solid var(--spark1);border-radius:14px;
  box-shadow:0 0 0 4px #0B1A2A88,0 0 22px 4px var(--spark1);
  transition:all .32s cubic-bezier(.3,.9,.4,1);opacity:0;
}
#tutorRing.on{opacity:1;animation:ringPulse 1.4s ease-in-out infinite alternate}
@keyframes ringPulse{from{box-shadow:0 0 0 4px #0B1A2A88,0 0 22px 4px var(--spark1)}
                     to{box-shadow:0 0 0 4px #0B1A2A88,0 0 34px 8px var(--spark1)}}
/* 손가락 */
#tutorHand{
  position:absolute;font-size:34px;transition:all .32s cubic-bezier(.3,.9,.4,1);
  opacity:0;pointer-events:none;filter:drop-shadow(0 3px 6px #0008);
}
#tutorHand.on{opacity:1;animation:tapAnim 1.25s ease-in-out infinite}
@keyframes tapAnim{
  0%,100%{transform:translate(0,0) scale(1)}
  45%{transform:translate(-5px,-9px) scale(1.12)}
  60%{transform:translate(0,0) scale(.94)}
}
/* 설명 말풍선 */
#tutorBox{
  position:absolute;left:50%;transform:translateX(-50%);
  width:min(320px,calc(100% - 32px));padding:16px 18px;border-radius:15px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 14px 34px #0007;backdrop-filter:blur(8px);
  text-align:center;pointer-events:auto;transition:top .32s ease,bottom .32s ease;
}
#tutorBox h3{
  font-family:'Gowun Batang',serif;font-size:17px;margin:0 0 6px;color:var(--text);
}
#tutorBox p{font-size:13px;line-height:1.75;color:var(--dim);margin:0 0 12px}
#tutorBox p b{color:var(--text);font-weight:400}
#tutorBox .row{display:flex;gap:8px}
#tutorBox button{
  flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;
  font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;
  background:var(--accent);color:#fff;
}
#tutorBox button.ghost{
  background:transparent;border:1px solid var(--line);color:var(--dim);
  font-weight:400;flex:0 0 40%;
}
.tutorDots{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.tutorDots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.tutorDots i.on{background:var(--accent);width:16px;border-radius:3px}

/* ══ 홈 화면 ══ */
#home{
  position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;
  align-items:center;padding:26px 18px 24px;overflow-y:auto;
  background:radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
}
#home.off{display:none}
/* 배경 발자국 패턴 */
#home::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(circle at 20% 15%,var(--text) 2.5px,transparent 3px),
    radial-gradient(circle at 78% 28%,var(--text) 2.5px,transparent 3px),
    radial-gradient(circle at 35% 62%,var(--text) 2.5px,transparent 3px),
    radial-gradient(circle at 88% 74%,var(--text) 2.5px,transparent 3px),
    radial-gradient(circle at 12% 88%,var(--text) 2.5px,transparent 3px),
    radial-gradient(circle at 60% 45%,var(--text) 2.5px,transparent 3px);
  background-size:190px 190px;
}
.homeInner{
  position:relative;z-index:1;width:100%;max-width:390px;
  display:flex;flex-direction:column;align-items:center;flex:1;
}
/* 로고 */
.logo{text-align:center;margin:8px 0 18px}
.logo .mark{display:flex;justify-content:center;gap:2px;margin-bottom:8px}
.logo .mark svg{width:44px;height:44px}
.logo .mark svg:nth-child(2){width:54px;height:54px;margin-top:-6px}
.logo h1{
  font-family:'Gowun Batang',serif;font-size:33px;margin:0;letter-spacing:.02em;
  color:var(--text);text-shadow:0 2px 0 #ffffff55,0 4px 14px #0002;
}
.logo .en{
  font-size:10px;letter-spacing:.42em;color:var(--dim);margin-top:5px;
}
/* 상단 버튼 줄 */
.homeBar{display:flex;gap:7px;width:100%;margin-bottom:12px;align-items:stretch}
.homeCoin{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:10px;border-radius:13px;
  background:linear-gradient(135deg,#FFE9A8,#FFD166);
  border:1.5px solid #C98F2E77;color:#5A3E12;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:16px;
}
.homeIco{
  width:46px;flex:none;border-radius:13px;border:1.5px solid var(--line);
  background:var(--chip);font-size:19px;cursor:pointer;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.homeIco:active{transform:translateY(2px)}
#homeLang{font-family:'Gowun Batang',serif;font-size:13px;font-weight:700;letter-spacing:.04em}
/* 진행 카드 */
.progCard{
  width:100%;padding:20px 18px;border-radius:19px;margin-bottom:12px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 10px 26px #0000002e;text-align:center;
}
.progCard .lab{font-size:10.5px;letter-spacing:.26em;color:var(--dim);margin-bottom:6px}
.progCard .lv{
  font-family:'Gowun Batang',serif;font-size:52px;line-height:1;font-weight:700;
  color:var(--text);
}
.progCard .nm{font-size:14px;color:var(--dim);margin-top:6px;font-family:'Gowun Batang',serif}
.progStars{display:flex;justify-content:center;gap:5px;margin-top:11px;font-size:19px}
.progStars .s{opacity:.28;filter:grayscale(1)}
.progStars .s.on{opacity:1;filter:none}
/* 메인 버튼 */
.homeBtn{
  width:100%;padding:16px;border-radius:15px;border:none;cursor:pointer;margin-bottom:9px;
  font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;letter-spacing:.03em;
  background:var(--accent);color:#fff;box-shadow:0 5px 0 #00000022;
}
.homeBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #00000022}
.homeBtn.sub{
  background:var(--chip);color:var(--text);border:1.5px solid var(--line);
  font-size:15px;padding:13px;box-shadow:none;
}
.homeBtn.gold{background:linear-gradient(135deg,#FFD166,#F0A93C);color:#4A320C}
/* 기록 줄 */
.homeStats{display:flex;gap:7px;width:100%;margin-bottom:12px}
.homeStats div{
  flex:1;padding:11px 6px;border-radius:13px;text-align:center;
  background:var(--chip);border:1px solid var(--line);
}
.homeStats b{display:block;font-family:'Gowun Batang',serif;font-size:19px;line-height:1.15}
.homeStats span{font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
/* 칭호 */
.titleBadge{
  width:100%;padding:11px;border-radius:13px;text-align:center;margin-bottom:12px;
  background:linear-gradient(135deg,var(--spark1),var(--spark2));color:#3A2A0E;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:14px;
}
.homeFoot{
  margin-top:auto;padding-top:14px;font-size:10.5px;color:var(--dim);text-align:center;line-height:1.7;
}
/* 설정 시트 */
.setRow{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px;
}
.setRow:last-of-type{border-bottom:none}
.setRow .l{display:flex;align-items:center;gap:8px}
.toggle{
  width:50px;height:29px;border-radius:15px;border:none;cursor:pointer;position:relative;
  background:var(--line);transition:background .2s;flex:none;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004;
}
.toggle.on::after{transform:translateX(21px)}

/* ══ 막 완주 엔딩 ══ */
.endingWrap{
  position:absolute;left:50%;top:44%;text-align:center;
  font-family:'Gowun Batang',serif;opacity:0;
  animation:endIn 3.4s ease-out forwards;
}
.endingWrap .crown{font-size:52px;line-height:1;margin-bottom:10px;
  filter:drop-shadow(0 0 22px var(--spark1))}
.endingWrap .k{font-size:12px;letter-spacing:.5em;color:var(--spark1);margin-bottom:8px}
.endingWrap .n{
  font-size:38px;font-weight:700;line-height:1.25;color:var(--text);
  text-shadow:0 3px 0 #00000033,0 0 36px var(--spark1);
}
.endingWrap .s{font-size:13px;letter-spacing:.14em;color:var(--dim);margin-top:12px;line-height:1.8}
@keyframes endIn{
  0%,8%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  28%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
}
/* 엔딩 배경 — 서서히 밝아지는 빛 */
.endingGlow{
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 44%,var(--spark1),transparent 62%);
  opacity:0;animation:glowIn 3.4s ease-out forwards;
}
@keyframes glowIn{0%{opacity:0}22%{opacity:.5}72%{opacity:.45}100%{opacity:0}}
/* 완주 배지 */
.actBadge{
  padding:16px;border-radius:14px;margin:0 0 14px;text-align:center;
  background:linear-gradient(135deg,var(--spark1),var(--spark2));
  border:1px solid #ffffff44;color:#3A2A0E;
}
.actBadge .big{display:block;font-family:'Gowun Batang',serif;font-size:26px;line-height:1.2;margin-bottom:4px}
.actBadge .sm{font-size:11px;letter-spacing:.16em;opacity:.85}
/* 새 막 안내 */
.actNext{
  padding:11px;border-radius:11px;margin:0 0 14px;
  background:var(--chip);border:1px dashed var(--line);
  font-size:12.5px;color:var(--dim);line-height:1.7;
}
.actNext b{color:var(--text);font-family:'Gowun Batang',serif;font-size:14px}
.nameRow{display:flex;gap:7px;margin-bottom:14px}
.nameRow input{
  flex:1;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--chip);color:var(--text);font-family:inherit;font-size:14px;min-width:0;
}
.nameRow input:focus{outline:2px solid var(--accent);outline-offset:1px}
.nameRow button{
  padding:0 16px;border-radius:11px;border:none;cursor:pointer;background:var(--accent);color:#fff;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:14px;white-space:nowrap;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:8px;font-weight:400}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.pointsPop{
  position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);
  font-family:'Gowun Batang',serif;font-weight:700;font-size:26px;color:var(--spark1);
  text-shadow:0 2px 0 #00000055,0 0 14px var(--spark1);
  animation:rise .85s ease-out forwards;white-space:nowrap;
}
.pointsPop .cb{display:block;font-size:14px;color:var(--spark2);letter-spacing:.1em}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
 20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
 100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

#overlay{position:fixed;inset:0;background:#0b1a2a99;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px;z-index:99}
#overlay.on{display:flex}
.card{
  width:100%;max-width:330px;padding:26px 22px;border-radius:18px;text-align:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px #0000005e;backdrop-filter:blur(8px);
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
}
.card h2{font-family:'Gowun Batang',serif;font-size:23px;margin:0 0 6px}
.card p{font-size:13px;line-height:1.7;color:var(--dim);margin:0 0 16px}
.card p b{color:var(--text);font-weight:400}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pick button{padding:9px 4px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--text);border:1px solid var(--line);background:var(--chip)}
.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick i{display:block;height:22px;border-radius:6px;margin-bottom:5px;font-style:normal}
.btn{
  width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-family:'Gowun Batang',serif;font-size:16px;font-weight:700;letter-spacing:.04em;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function T(key,vars){

  if(s===undefined) s=I18N.ko[key];
  if(s===undefined) return key;
  if(typeof s!=='string') return s;
  if(vars) for(const k in vars) s=s.split('{'+k+'}').join(vars[k]);
  return s;
}
function setLang(l){
  LANG=(l==='en')?'en':'ko';
  try{ localStorage.setItem('animaltile.lang',LANG); }catch(e){}
  document.documentElement.lang=LANG;

  if(typeof paintHome==='function' && !$('home').classList.contains('off')) paintHome();
}
/* 화면에 고정된 텍스트를 현재 언어로 바꾼다 */
function applyStaticText(){
  const set=(id,txt)=>{ const e=$(id); if(e) e.textContent=txt; };
  document.title=T('appTitle');
  set('logoTitle',T('appTitle'));
  set('logoSub',T('appSub'));
  set('lblLevel',T('level')); set('lblScore',T('score')); set('lblTime',T('timeLeft'));
  set('lblContinue',T('continueFrom'));
  set('lblBest',T('bestScore')); set('lblBestLv',T('bestLevel')); set('lblActs',T('actsDone'));
  set('homeHint1',T('homeHint1'));
  const h2=$('homeHint2'); if(h2) h2.innerHTML=T('homeHint2');
  set('brandName',T('appTitle'));
  /* 도구 버튼 */
  const tool=(id,t,d)=>{ const e=$(id); if(!e) return;
    const n=e.querySelector('.n'); const num=n?n.outerHTML:'';
    e.innerHTML='<b>'+T(t)+'</b>'+T(d)+num; };
  tool('btnUndo','tUndo','tUndoD');
  tool('btnShuffle','tShuffle','tShuffleD');
  tool('btnPull','tPull','tPullD');
  updateItems&&updateItems();
}


/* ══ 동물 세트 (SVG) ══
   기기별로 모양이 달라지는 이모지 대신 직접 그린 SVG를 쓴다.
   sym 값은 'dog' 같은 키 문자열이며, 화면에는 <use href="#an-dog">로 그린다.
   캔버스 파티클에는 SVG를 직접 못 그리므로 미리 PNG로 구워 캐시한다. */
const ANIMAL_DEFS=[
  {k:'dog',n:'강아지'},
  {k:'cat',n:'고양이'},
  {k:'rabbit',n:'토끼'},
  {k:'bear',n:'곰'},

  {k:'pig',n:'돼지'},
  {k:'tiger',n:'호랑이'}
];
const ANIMALS=ANIMAL_DEFS.map(a=>a.k);
function animalName(k){ return (T('animals')||{})[k]||k; }
const ANIMAL_NAME=new Proxy({},{get:(o,k)=>animalName(k)});

/* 타일/트레이용 SVG 엘리먼트 생성 */
function animalSVG(key,px){
  const el=document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('viewBox','0 0 64 64');
  el.setAttribute('width',px); el.setAttribute('height',px);
  el.setAttribute('aria-label',ANIMAL_NAME[key]||key);
  const u=document.createElementNS('http://www.w3.org/2000/svg','use');
  u.setAttribute('href','#an-'+key);
  el.appendChild(u);
  return el;
}

const animalBitmap={};
function bakeAnimals(){
  const SIZE=96;
  ANIMALS.forEach(function(key){

function ac(){
  if(muted) return null;
  if(!audio){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; audio=new C(); }
  if(audio.state==='suspended') audio.resume();
  return audio;
}
function tone(freq,dur,type,vol,delay){
  const a=ac(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||.12,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.02);
}
function noise(dur,vol,freq,delay){
  const a=ac(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const len=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq||3200; bp.Q.value=.8;
  const g=a.createGain(); g.gain.setValueAtTime(vol||.08,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t0);
}
function thump(freq,dur,vol,delay){
  const a=ac(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t0);
  o.frequency.exponentialRampToValueAtTime(freq*.4,t0+dur);
  g.gain.setValueAtTime(vol||.2,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.02);
}

    noise(.14,.05,6500,.16);

/* ══════════════════════════════════════════════
   배경음악 (BGM)
   ────────────────────────────────────────────────
   mp3 파일을 index.html 옆의 bgm/ 폴더에 넣으면 자동 재생됩니다.
     bgm/calm.mp3   — 평상시 (마림바/칼림바 계열, 100~110 BPM 권장)
     bgm/tense.mp3  — 막판/위기 (남은시간 45초 이하 또는 받침 6칸)
   파일이 없으면 조용히 무시하고 게임은 그대로 돌아갑니다.
   ══════════════════════════════════════════════ */
const BGM={
  src:{calm:'bgm/calm.mp3', tense:'bgm/tense.mp3'},
  el:{}, ok:{}, cur:null, on:true, vol:.42, duckT:null, fadeT:{},
  init:function(){
    try{ this.on=localStorage.getItem('animaltile.bgm')!=='0'; }catch(e){}
    let any=false;
    for(const k in this.src){
      const a=new Audio(this.src[k]);
      a.loop=true; a.preload='auto'; a.volume=0;
      a.addEventListener('canplaythrough',()=>{ this.ok[k]=true; this.paint(); },{once:true});
      a.addEventListener('error',()=>{ this.ok[k]=false; this.paint(); });
      this.el[k]=a; any=true;
    }
    this.paint();
  },
  available:function(){ return Object.keys(this.ok).some(k=>this.ok[k]); },
  paint:function(){
    const b=$('btnMusic'); if(!b) return;
    b.classList.toggle('off',!this.on);
    b.textContent=this.on?'🎵':'🎵';
    b.classList.toggle('missing',!this.available()&&Object.keys(this.ok).length>0);
    b.title=this.available()?(this.on?T('bgmOff'):T('bgmOn')):T('bgmMissing');
  },
  fade:function(k,target,ms){
    const a=this.el[k]; if(!a) return;
    clearInterval(this.fadeT[k]);
    const steps=Math.max(1,Math.round(ms/40)), from=a.volume, d=(target-from)/steps;
    let i=0;
    this.fadeT[k]=setInterval(()=>{
      i++;
      a.volume=Math.min(1,Math.max(0,from+d*i));
      if(i>=steps){
        clearInterval(this.fadeT[k]);
        if(a.volume<=.001){ try{ a.pause(); a.currentTime=0; }catch(e){} }
      }
    },40);
  },
  play:function(k){
    if(!this.on||!this.el[k]||this.ok[k]===false) return;
    if(this.cur===k) return;
    const prev=this.cur; this.cur=k;
    const a=this.el[k];
    try{ const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    this.fade(k,this.vol,900);
    if(prev&&this.el[prev]) this.fade(prev,0,900);
  },
  stop:function(){
    for(const k in this.el) this.fade(k,0,400);
    this.cur=null;
  },
  /* 콤보가 터질 때 잠시 BGM을 눌러 효과음이 뚫고 나오게 한다 */
  duck:function(ms){
    if(!this.cur||!this.on) return;
    const k=this.cur;
    clearTimeout(this.duckT);
    this.fade(k,this.vol*.25,120);
    this.duckT=setTimeout(()=>{ if(this.cur===k) this.fade(k,this.vol,500); },ms||700);
  },
  toggle:function(){
    this.on=!this.on;
    try{ localStorage.setItem('animaltile.bgm',this.on?'1':'0'); }catch(e){}
    if(!this.on) this.stop(); else { this.cur=null; syncBGM(); }
    this.paint();
  }
};

const fx=$('fx'),ctx=fx.getContext('2d');
let parts=[],raf=null,dpr=Math.min(2,window.devicePixelRatio||1);
function sizeFx(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  fx.width=innerWidth*dpr; fx.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function spawn(p){ if(!REDUCED) parts.push(p); }
function run(){ if(!raf) raf=requestAnimationFrame(loop); }
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life--;
    if(p.life<=0){ parts.splice(i,1); continue; }
    const k=p.life/p.max;
    if(p.kind==='ring'){
      const r=p.r0+(p.r1-p.r0)*(1-k);
      ctx.globalAlpha=k*.8; ctx.strokeStyle=p.color; ctx.lineWidth=p.w*k+.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.283); ctx.stroke();
    }else if(p.kind==='emoji'){
      p.y+=p.vy; p.vy+=.12; p.rot+=p.vr;
      ctx.globalAlpha=Math.min(1,k*1.6);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      drawAnimal(ctx,p.text,p.size); ctx.restore();
    }else if(p.kind==='ray'){
      p.len+=p.grow; p.grow*=.94;
      ctx.globalAlpha=k*.75;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      const g2=ctx.createLinearGradient(0,0,p.len,0);
      g2.addColorStop(0,p.color); g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.moveTo(0,-p.w*k); ctx.lineTo(p.len,0); ctx.lineTo(0,p.w*k);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }else if(p.kind==='shard'){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.98; p.rot+=p.vr;
      ctx.globalAlpha=Math.min(1,k*1.8);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      const r=Math.max(2,p.cr*(k*.6+.4));
      const hw=p.w/2,hh=p.h/2;
      ctx.beginPath();
      ctx.moveTo(-hw+r,-hh); ctx.lineTo(hw-r,-hh); ctx.arcTo(hw,-hh,hw,-hh+r,r);
      ctx.lineTo(hw,hh-r); ctx.arcTo(hw,hh,hw-r,hh,r);
      ctx.lineTo(-hw+r,hh); ctx.arcTo(-hw,hh,-hw,hh-r,r);
      ctx.lineTo(-hw,-hh+r); ctx.arcTo(-hw,-hh,-hw+r,-hh,r);
      ctx.closePath();
      /* 타일 face 색 그라디언트 */
      const gr=ctx.createLinearGradient(-hw,-hh,hw,hh);
      gr.addColorStop(0,p.c1); gr.addColorStop(1,p.c2);
      ctx.fillStyle=gr; ctx.fill();
      /* 광택 선 */
      ctx.globalAlpha*=.55; ctx.strokeStyle='#ffffffcc'; ctx.lineWidth=.8;
      ctx.beginPath(); ctx.moveTo(-hw+r,-hh+1); ctx.lineTo(hw-r,-hh+1); ctx.stroke();
      /* 테두리 그림자 */
      ctx.globalAlpha*=.6; ctx.strokeStyle=p.edge; ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(-hw+r,-hh); ctx.lineTo(hw-r,-hh); ctx.arcTo(hw,-hh,hw,-hh+r,r);
      ctx.lineTo(hw,hh-r); ctx.arcTo(hw,hh,hw-r,hh,r);
      ctx.lineTo(-hw+r,hh); ctx.arcTo(-hw,hh,-hw,hh-r,r);
      ctx.lineTo(-hw,-hh+r); ctx.arcTo(-hw,-hh,-hw+r,-hh,r);
      ctx.closePath(); ctx.stroke();
      /* 이모지 */
      ctx.globalAlpha=Math.min(1,k*2.2)*.9;
      drawAnimal(ctx,p.text,p.fs*1.55);
      ctx.restore();
    }else{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.99; p.rot+=p.vr;
      ctx.globalAlpha=Math.min(1,k*1.5); ctx.fillStyle=p.color;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.kind==='bar'){ ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
      else{ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.283); ctx.fill(); }
      ctx.restore();
    }
  }
  ctx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(loop):null;
}

function overlaps(a,b){ return Math.abs(a.x-b.x)<TW && Math.abs(a.y-b.y)<TH; }
function buildPositions(lv){
  const layers=layerCount(lv);
  const need=tileGoal(lv);
  const w=[]; for(let l=0;l<layers;l++) w.push(layers-l);
  const ws=w.reduce((a,b)=>a+b,0);
  const quota=w.map(x=>Math.max(3,Math.round(need*x/ws)));
  const pos=[];
  for(let l=0;l<layers;l++){
    const s=Math.min(l,3),minC=s,maxC=COLS-s,minR=s,maxR=ROWS-s;
    const mine=[]; let tries=0;
    while(mine.length<quota[l]&&tries<900){
      tries++;
      const c=minC+Math.floor(Math.random()*(maxC-minC+1));
      const r=minR+Math.floor(Math.random()*(maxR-minR+1));
      const p={x:c*HX,y:r*HY,layer:l};
      if(mine.some(q=>overlaps(p,q))) continue;
      mine.push(p);
    }
    pos.push.apply(pos,mine);
  }
  pos.sort((a,b)=>a.layer-b.layer||a.y-b.y||a.x-b.x);
  while(pos.length%3!==0) pos.pop();
  return pos;
}
function assignSymbols(pos,lv){
  const kinds=Math.min(ANIMALS.length,6+lv);
  const rest=pos.slice(); let k=0;
  while(rest.length){
    const free=rest.filter(p=>!rest.some(q=>q!==p&&q.layer>p.layer&&overlaps(p,q)));
    const pool=(free.length>=3?free.slice():rest.slice().sort((a,b)=>b.layer-a.layer));
    const pick=[];
    while(pick.length<3&&pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    const sym=ANIMALS[k%kinds]; k++;
    pick.forEach(p=>{ p.sym=sym; rest.splice(rest.indexOf(p),1); });
  }
  return pos;
}

/* ══ 렌더 ══ */
function drawBoard(){
  boardEl.innerHTML='';
  tiles.filter(t=>t.where==='board').sort((a,b)=>a.layer-b.layer||a.y-b.y||a.x-b.x).forEach(t=>{
    const el=document.createElement('div');
    el.className='tile';
    el.style.left=(t.x+t.layer*3)+'px';
    el.style.top=(t.y-t.layer*5)+'px';
    el.style.zIndex=t.layer*1000+Math.round(t.y);
    el.appendChild(animalSVG(t.sym,38));
    el.tabIndex=0; el.setAttribute('role','button');
    el.setAttribute('aria-label',ANIMAL_NAME[t.sym]||t.sym);
    el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); el.classList.add('pressed'); pick(t); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('pressed')));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(t); }});
    t.el=el; boardEl.appendChild(el);
  });
  fitBoard(); refreshBlocked();
}
function fitBoard(){
  const w=$('boardWrap');
  const s=Math.min(1.08,(w.clientWidth-8)/351,(w.clientHeight-8)/320);
  boardEl.style.transform='rotateX(8deg) scale('+Math.max(.62,s)+')';
}
function isFree(t){ return !tiles.some(o=>o.where==='board'&&o!==t&&o.layer>t.layer&&overlaps(t,o)); }
function refreshBlocked(){
  tiles.forEach(t=>{ if(t.where==='board'&&t.el) t.el.classList.toggle('blocked',!isFree(t)); });
}
function drawTray(popIndex){
  const counts={};
  tray.forEach(x=>counts[x.sym]=(counts[x.sym]||0)+1);
  trayEl.innerHTML='';
  trayEl.style.gridTemplateColumns='repeat('+TRAY_MAX+',1fr)';

    if(tray[i]){
      const f=document.createElement('div');
      f.className='face'+(i===popIndex?' pop':'')+(counts[tray[i].sym]===2?' ready':'');

/* ══ 조작 ══ */
function pick(t){
  if(!playing||clearing||t.where!=='board'||tray.length>=TRAY_MAX) return;
  if(!isFree(t)){
    t.el.classList.remove('shake'); void t.el.offsetWidth; t.el.classList.add('shake');
    sBlock(); return;
  }
  const from=t.el.getBoundingClientRect();
  puff(from.left+from.width/2,from.top+from.height/2);
  sPick();

  let idx=tray.length;
  for(let i=tray.length-1;i>=0;i--){ if(tray[i].sym===t.sym){ idx=i+1; break; } }

  t.where='tray'; t.el.remove(); t.el=null;
  tray.splice(idx,0,t);
  history.push(t);
  drawTray(idx); refreshBlocked(); updateItems();

  const to=t.face.getBoundingClientRect();
  t.face.style.transition='none';
  t.face.style.transform='translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+') rotate(-8deg)';
  requestAnimationFrame(()=>{
    if(!t.face) return;
    t.face.style.transition='transform .24s cubic-bezier(.25,.9,.35,1.2)';
    t.face.style.transform='translate(0,0) scale(1) rotate(0deg)';
  });
  setTimeout(check,210);
}

function check(){
  if(clearing||!playing) return;
  const counts={};
  tray.forEach(x=>counts[x.sym]=(counts[x.sym]||0)+1);
  const hit=Object.keys(counts).find(s=>counts[s]>=3);

  if(hit){
    clearing=true;
    const now=Date.now();
    combo=(now-lastMatchAt<COMBO_WINDOW)?combo+1:1;
    lastMatchAt=now;
    if(combo>=2){ $('comboLabel').classList.remove('hit'); void $('comboLabel').offsetWidth; $('comboLabel').classList.add('hit'); }
    updateComboUI();

    const group=tray.filter(x=>x.sym===hit).slice(0,3);
    let cx=0,cy=0;
    /* 1단계: 각 타일 위치 수집 + 반짝임 대기 (60ms) */
    const rects=[];
    group.forEach(x=>{
      if(!x.face) return;
      const r=x.face.getBoundingClientRect();
      rects.push({px:r.left+r.width/2, py:r.top+r.height/2});
      cx+=r.left+r.width/2; cy+=r.top+r.height/2;
    });
    cx/=rects.length; cy/=rects.length;

    /* 2단계: 찰나 흰빛 플래시 후 조각 분산 (stagger) */
    group.forEach((x,i)=>{
      setTimeout(()=>{
        if(!x.face) return;
        const r=x.face.getBoundingClientRect();
        const px=r.left+r.width/2, py=r.top+r.height/2;
        /* 타일 즉시 숨김 */
        x.face.style.transition='opacity 0s';
        x.face.style.opacity='0';
        /* 조각 파편 */
        shatter(px,py,x.sym);
        /* 충격파 링 */
        burst(px,py,null);
      }, i*55);
    });

    /* 3단계: 중앙 빅 이모지 + 화면 흔들기 */
    setTimeout(()=>{
      burst(cx,cy-10,hit);
      jolt();
      sMatch(combo);
      comboFX(combo,cx,cy-10);
      vibe(combo>=3?60:25);
      if(combo>=2) BGM.duck(700+combo*120);
    }, 120);

    const gain=Math.round((100+level*10)*(combo>1?combo:1)*(isBonus?BONUS_MULT:1));
    pointsPop(cx,cy-40,'+'+gain,isBonus?'GOLD x'+BONUS_MULT:(combo>1?'COMBO x'+combo:''));

    /* 4단계: 상태 업데이트 (파편이 튀는 동안 처리) */
    setTimeout(()=>{
      group.forEach(x=>{ x.where='gone'; const i=tray.indexOf(x); if(i>-1) tray.splice(i,1); });
      history=[];
      score+=gain; $('hudScore').textContent=score;
      $('scoreStat').classList.remove('bump'); void $('scoreStat').offsetWidth; $('scoreStat').classList.add('bump');
      if(isBonus){ bonusCleared++; bonusEarned+=gain; updateBonusHUD(); }
      drawTray(-1); updateItems(); clearing=false;
      if(tiles.every(t=>t.where==='gone')){
        if(isBonus) bonusEnd(T('bonusAllDone')); else win();
      } else check();
    },340);
    return;
  }
  if(tray.length>=TRAY_MAX){
    if(isBonus) bonusEnd(T('trayFull'));
    else lose(T('trayFull'));
  }
}

/* ══ 아이템 ══ */
function useUndo(){
  if(clearing||!playing||items.undo<=0||!history.length) return;
  const t=history.pop(); const i=tray.indexOf(t); if(i>-1) tray.splice(i,1);
  t.where='board'; items.undo--; tone(420,.14,'sine',.08);

/* ══ 보너스 스테이지: 골든 타일 러시 ══
   5스테이지마다 등장. 층 없이 평면으로만 깔려서 모든 타일을 바로 집을 수 있다.
   45초 안에 최대한 많이 없애는 점수 벌이 판. 실패 개념이 없다(받침이 차면 종료되고 정산). */
const BONUS_EVERY=5, BONUS_TIME=45, BONUS_MULT=3;

/* ══ 난이도 곡선 ══
   화면(11×8 격자)이 물리적으로 60장 남짓밖에 수용하지 못하므로,
   타일 수만 늘리면 6단계쯤에서 포화되어 난이도가 멈춘다.
   따라서 실제로 조여지는 축을 셋으로 나눈다:
     1) 제한시간 — 300초에서 단계마다 줄여 최소 150초
     2) 받침 칸  — 7칸에서 구간별로 줄여 최소 5칸
     3) 판 밀도  — 층수를 단계별로 올림
   보너스 스테이지는 이 조임에서 제외된다. */
function levelTime(lv){
  if(isBonusLevel(lv)) return BONUS_TIME;
  /* 막의 마지막은 보스전 — 가장 빡빡한 시간 */
  if(isActFinale(lv)) return Math.max(140, 240-actOf(lv)*20);
  return Math.max(150, 300-(lv-1)*8);
}
function trayMax(lv){
  if(isBonusLevel(lv)) return 7;
  if(isActFinale(lv)) return 5;
  if(lv>=16) return 5;
  if(lv>=9)  return 6;
  return 7;
}
function layerCount(lv){
  if(lv>=13) return 5;
  if(lv>=9)  return 4;
  if(lv>=4)  return 3;
  return 2;
}
function tileGoal(lv){
  return Math.min(57, 30+(lv-1)*3);
}

/* ══ 막(Act) — 20단계가 1막 ══ */
const ACT_LENGTH=20;
function actOf(lv){ return Math.floor((lv-1)/ACT_LENGTH)+1; }
function isActFinale(lv){ return lv%ACT_LENGTH===0; }

let isBonus=false, bonusCleared=0, bonusEarned=0;
/* 20단계는 5의 배수이기도 하므로 보너스와 겹친다.
   막의 마지막은 반드시 정규 스테이지여야 엔딩이 나오므로 보너스에서 제외한다. */
function isBonusLevel(lv){ return lv%BONUS_EVERY===0 && lv%ACT_LENGTH!==0; }

/* 평면 격자로 촘촘히 채운다 — 층이 없으니 전부 free */
function buildBonusPositions(){
  const pos=[];
  for(let r=0;r<=ROWS;r+=2){
    for(let c=0;c<=COLS-1;c+=2){
      pos.push({x:c*HX,y:r*HY,layer:0});
    }
  }
  while(pos.length%3!==0) pos.pop();
  return pos;
}
/* 보너스는 종류를 적게 써서 매칭이 잘 터지게 한다 */
function assignBonusSymbols(pos){
  const kinds=5;
  const trio=[];
  for(let i=0;i<pos.length/3;i++) trio.push(ANIMALS[i%kinds]);
  for(let i=trio.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=trio[i]; trio[i]=trio[j]; trio[j]=t; }
  const slots=pos.slice();
  for(let i=slots.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=slots[i]; slots[i]=slots[j]; slots[j]=t; }
  slots.forEach((p,i)=>{ p.sym=trio[Math.floor(i/3)]; });
  return pos;
}

/* ══ 스테이지 지도 (윷놀이 말판) ══
   현재 위치를 중심으로 앞뒤 스테이지를 뱀 모양(좌→우, 우→좌 교대)으로 배치한다.
   보너스 칸이 어디인지, 몇 판 남았는지 한눈에 보이게 하는 게 목적. */
const MAP_COLS=5, MAP_ROWS=4;
function buildMap(currentLv){
  const total=MAP_COLS*MAP_ROWS;
  /* 현재 단계가 항상 둘째 줄쯤에 오도록 시작점을 잡는다 */
  let start=Math.max(1,currentLv-MAP_COLS-1);
  const cells=[];
  for(let i=0;i<total;i++) cells.push(start+i);

  /* 뱀 모양: 홀수 줄은 오른쪽→왼쪽으로 뒤집는다 */
  const rows=[];
  for(let r=0;r<MAP_ROWS;r++){
    const row=cells.slice(r*MAP_COLS,(r+1)*MAP_COLS);
    rows.push(r%2===1?row.slice().reverse():row);
  }
  return {rows:rows,flat:cells};
}
function mapHTML(currentLv){
  const m=buildMap(currentLv);
  let html='<div id="mapWrap"><div class="mapTitle">'+T('mapLabel')+'</div><div class="mapGrid">';
  m.rows.forEach(function(row,r){
    row.forEach(function(lv,c){
      const bonus=isBonusLevel(lv);
      const state=lv<currentLv?'done':(lv===currentLv?'now':'todo');
      /* 줄의 끝 칸은 아래로 이어지는 표시 */
      const isRowEnd=(c===MAP_COLS-1);
      const isLast=(r===MAP_ROWS-1&&c===MAP_COLS-1);
      const cls=['node',state,isActFinale(lv)?'finale':(bonus?'bonusNode':''),isRowEnd?'rowEnd':'',isLast?'last':''].filter(Boolean).join(' ');
      let inner;
      if(isActFinale(lv)) inner='<span class="mark">👑</span><span class="tag">'+lv+'</span>';
      else if(bonus) inner='<span class="mark">🌟</span><span class="tag">BONUS</span>';
      else if(state==='done') inner='<span class="mark">✓</span><span class="tag">'+lv+'</span>';
      else inner='<span class="lv">'+lv+'</span>';
      html+='<div class="'+cls+'">'+inner+'</div>';
    });
  });
  html+='</div>';

  /* 다음 보너스까지 남은 판 수 */
  const nextBonus=Math.ceil(currentLv/BONUS_EVERY)*BONUS_EVERY;
  const left=nextBonus-currentLv;
  if(isBonusLevel(currentLv)){
    html+='<div class="mapHint">'+T('bonusNow')+'</div>';
  }else if(left===0){
    html+='<div class="mapHint">'+T('bonusNextOne')+'</div>';
  }else{
    html+='<div class="mapHint">'+T('bonusIn',{n:left})+'</div>';
  }
  html+='</div>';
  return html;
}

/* ══ 코인 ══
   스테이지를 깨면 쌓이고, 게임 오버 시 부활에 쓴다.
   지금은 순수 게임 내 재화이며, 나중에 광고 시청으로 얻는 경로를 붙일 수 있게
   earnCoins()/spendCoins() 한 곳으로 모아둔다. */
let coins=0;
try{ coins=parseInt(localStorage.getItem('animaltile.coins')||'0',10)||0; }catch(e){}
const REVIVE_BASE=30;          /* 첫 부활 비용 */
let revivesUsed=0;             /* 한 판에서 쓴 부활 횟수 — 쓸수록 비싸진다 */
function reviveCost(){ return REVIVE_BASE*Math.pow(2,revivesUsed); }

function saveCoins(){ try{ localStorage.setItem('animaltile.coins',String(coins)); }catch(e){} }
function paintCoins(bump){
  const el=$('hudCoin'); if(!el) return;
  el.textContent=coins.toLocaleString();
  if(bump){
    const c=$('coinChip');
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
}
function earnCoins(n){
  if(n<=0) return 0;
  coins+=n; saveCoins(); paintCoins(true);
  tone(880,.12,'sine',.07); tone(1180,.14,'sine',.05,.07);
  return n;
}
function spendCoins(n){
  if(coins<n) return false;
  coins-=n; saveCoins(); paintCoins(true);
  return true;
}
/* 스테이지 보상 — 클리어 상태에 따라 차등 */
function stageCoins(perfect,bonus){
  if(bonus) return 25;
  return perfect?20:12;
}
paintCoins(false);

/* ══ 부활 ══
   받침을 절반 이상 비워 이어서 플레이한다.
   10초 카운트다운을 두어 "지금 결정하라"는 긴장을 만든다. */
let reviveTimer=null;
function offerRevive(reason,onDecline){
  const cost=reviveCost();
  const can=coins>=cost;
  let left=10;

  card.innerHTML=
    '<div class="reviveHead">'+T('danger')+'</div>'+
    '<p>'+reason+'<br>'+T('stageUnit',{n:level})+' · <b>'+score.toLocaleString()+'</b></p>'+
    '<div class="reviveRing">'+
      '<svg width="96" height="96" viewBox="0 0 96 96">'+
        '<circle class="bg" cx="48" cy="48" r="42"/>'+
        '<circle class="fg" id="revArc" cx="48" cy="48" r="42" '+
          'stroke-dasharray="263.9" stroke-dashoffset="0"/>'+
      '</svg>'+
      '<div class="cnt" id="revCnt">10</div>'+
    '</div>'+
    '<div class="reviveCost">'+T('reviveCost')+' <span class="coinChip">🪙 '+cost+'</span>'+
      (can?'':' <span style="color:var(--danger)">'+T('coinShort')+'</span>')+'</div>';

  const go=document.createElement('button');
  go.className='btn revive'; go.disabled=!can;
  go.textContent=can?T('reviveBtn'):T('noCoins');
  go.onclick=()=>{
    if(!spendCoins(cost)) return;
    clearInterval(reviveTimer);
    overlay.classList.remove('on');
    doRevive();
  };
  card.appendChild(go);

  const no=document.createElement('button');
  no.className='btn ghost'; no.textContent=T('giveUp');
  no.onclick=()=>{ clearInterval(reviveTimer); overlay.classList.remove('on'); onDecline(); };
  card.appendChild(no);

  overlay.classList.add('on');

  /* 카운트다운 — 시간이 다 되면 자동 포기 */
  const arc=$('revArc'), cnt=$('revCnt');
  clearInterval(reviveTimer);
  reviveTimer=setInterval(()=>{
    left--;
    if(cnt) cnt.textContent=left;
    if(arc) arc.setAttribute('stroke-dashoffset',String(263.9*(1-left/10)));
    if(left<=3) tone(660,.09,'square',.06);
    if(left<=0){
      clearInterval(reviveTimer);
      overlay.classList.remove('on');
      onDecline();
    }
  },1000);
}
/* 실제 부활 처리 — 받침을 비우고 시간을 조금 돌려준다 */
function doRevive(){
  revivesUsed++;
  clearInterval(timerId); clearInterval(reviveTimer);
  overlay.classList.remove('on');

  /* 받침에 있던 타일을 보드로 되돌린다 */

/* ══ 튜토리얼 ══
   글로 설명하지 않고 실제 게임 요소를 가리켜 직접 눌러보게 한다.
   첫 실행 때만 뜨고, 이후에는 도움말 버튼으로 다시 볼 수 있다. */
let tutorDone=false, tutorStep=0, tutorWatch=null;
try{ tutorDone=localStorage.getItem('animaltile.tutor')==='1'; }catch(e){}

const TUTOR=[
  {
    title:'tu1t', body:'tu1b',
    target:()=>trayEl, place:'above', hand:false, next:'button'
  },
  {
    title:'tu2t', body:'tu2b',
    target:()=>{
      const free=tiles.filter(t=>t.where==='board'&&t.el&&isFree(t));
      return free.length?free[Math.floor(free.length/2)].el:boardEl;
    },
    place:'below', hand:true, next:'action'   /* 실제로 눌러야 넘어감 */
  },
  {
    title:'tu3t', body:'tu3b',
    target:()=>trayEl, place:'above', hand:false, next:'button'
  },
  {
    title:'tu4t', body:'tu4b',
    target:()=>document.querySelector('.tools'), place:'above', hand:false, next:'button'
  },
  {
    title:'tu5t', body:'tu5b',
    target:()=>$('coinChip'), place:'below', hand:false, next:'button'
  }
];

function tutorPos(el){
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.top,w:r.width,h:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2};
}
function showTutorStep(i){
  if(i>=TUTOR.length){ endTutor(true); return; }
  tutorStep=i;
  const step=TUTOR[i];
  const el=step.target();
  if(!el){ showTutorStep(i+1); return; }
  const p=tutorPos(el);
  const pad=8;

  /* 구멍 뚫린 마스크 */
  const rx=Math.max(p.w,p.h)/2+pad+6;
  const mask='radial-gradient(circle at '+p.cx+'px '+p.cy+'px, transparent '+(rx-10)+'px, #000 '+(rx+14)+'px)';
  const m=$('tutorMask');
  m.style.webkitMaskImage=mask; m.style.maskImage=mask;

  /* 강조 테두리 */
  const ring=$('tutorRing');
  ring.style.left=(p.x-pad)+'px'; ring.style.top=(p.y-pad)+'px';
  ring.style.width=(p.w+pad*2)+'px'; ring.style.height=(p.h+pad*2)+'px';
  ring.classList.add('on');

  /* 손가락 */
  const hand=$('tutorHand');
  if(step.hand){
    hand.style.left=(p.cx-6)+'px'; hand.style.top=(p.cy+p.h/2-4)+'px';
    hand.classList.add('on');
  }else hand.classList.remove('on');

  /* 설명 상자 — 대상 위/아래에 배치 */
  const box=$('tutorBox');
  const dots=TUTOR.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('');
  const btnLabel=(step.next==='action')?'':(i===TUTOR.length-1?T('tuStart'):T('tuNext'));
  box.innerHTML=
    '<div class="tutorDots">'+dots+'</div>'+
    '<h3>'+T(step.title)+'</h3><p>'+T(step.body)+'</p>'+
    (btnLabel?'<div class="row"><button class="ghost" id="tutorSkip">'+T('tuSkip')+'</button>'+
      '<button id="tutorNext">'+btnLabel+'</button></div>'
     :'<div class="row"><button class="ghost" id="tutorSkip">'+T('tuSkip')+'</button></div>');

  if(step.place==='above'){
    box.style.top='auto'; box.style.bottom=(innerHeight-p.y+16)+'px';
  }else{
    box.style.bottom='auto'; box.style.top=(p.y+p.h+16)+'px';
  }
  /* 화면 밖으로 나가지 않게 보정 */
  requestAnimationFrame(()=>{
    const br=box.getBoundingClientRect();
    if(br.top<8){ box.style.bottom='auto'; box.style.top='8px'; }
    if(br.bottom>innerHeight-8){ box.style.top='auto'; box.style.bottom='8px'; }
  });

  const sk=$('tutorSkip'); if(sk) sk.onclick=()=>endTutor(true);
  const nx=$('tutorNext'); if(nx) nx.onclick=()=>showTutorStep(i+1);

  /* 직접 눌러야 넘어가는 단계 — 타일 수가 줄면 성공으로 본다 */
  clearInterval(tutorWatch);
  if(step.next==='action'){
    const before=tiles.filter(t=>t.where==='board').length;
    tutorWatch=setInterval(()=>{
      if(tiles.filter(t=>t.where==='board').length<before){
        clearInterval(tutorWatch);
        setTimeout(()=>showTutorStep(i+1),450);
      }
    },160);
  }
}
function startTutor(){
  if(!playing) return;
  $('tutor').classList.add('on');
  /* 튜토리얼 동안은 시간이 흐르지 않게 */

function endTutor(save){
  clearInterval(tutorWatch);

/* ══ 리더보드 (서버 API) ══ */
const API='https://oil-war-game.onrender.com/api/leaderboard';
const LB_MAX=20;
let lbCache=[], lbState='idle'; /* idle | loading | ok | offline */

/* Render 무료 플랜은 15분 미사용 시 잠들고, 깨어나는 데 최대 60초가 걸린다.
   따라서 타임아웃을 넉넉히 주고, 실패하면 한 번 더 시도한다.
   그동안 마지막으로 받아온 순위를 localStorage에 캐시해 화면이 비지 않게 한다. */
try{ lbCache=JSON.parse(localStorage.getItem('animaltile.lbcache'))||[]; }catch(e){}

function cacheLB(){ try{ localStorage.setItem('animaltile.lbcache',JSON.stringify(lbCache)); }catch(e){} }

async function fetchLB(opts){
  const tries=(opts&&opts.tries)||2;
  const ms=(opts&&opts.timeout)||20000;
  lbState='loading';
  for(let i=0;i<tries;i++){
    try{
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),ms);
      const r=await fetch(API,{signal:c.signal,cache:'no-store'});
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await r.json();
      if(Array.isArray(data)){ lbCache=data; cacheLB(); lbState='ok'; return lbCache; }
      throw new Error('형식 오류');
    }catch(e){
      if(i===tries-1){ lbState='offline'; }
      else await new Promise(r=>setTimeout(r,1500)); /* 서버 기동 대기 */
    }
  }
  return lbCache;
}
async function postLB(name,sc,lv){
  let lastErr;
  for(let i=0;i<2;i++){
    try{
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),25000);
      const r=await fetch(API,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:name,score:sc,level:lv}),
        signal:c.signal
      });
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ lastErr=e; if(i===0) await new Promise(r=>setTimeout(r,1500)); }
  }
  throw lastErr;
}
/* 서버를 미리 깨워둔다 — 게임하는 동안 기동이 끝나 있도록 */
function wakeServer(){ fetch(API,{cache:'no-store'}).catch(()=>{}); }

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function lbHTML(highlightId){
  if(!lbCache.length){
    return '<div class="lbEmpty">'+(lbState==='offline'
      ? T('offlineMsg')
      : T('noRecords'))+'</div>';
  }
  const medal=['🥇','🥈','🥉'];
  const stale=(lbState==='offline')?'<div class="lbNote">'+T('offlineNote')+'</div>':'';
  return stale+'<div class="lb">'+lbCache.map(function(e,i){
    return '<div class="lbRow'+(i<3?' top'+(i+1):'')+(e.id===highlightId?' me':'')+'">'+
      '<span class="rk">'+(medal[i]||(i+1))+'</span>'+
      '<span class="nm">'+escapeHTML(e.name)+'</span>'+
      '<span class="sc">'+e.score.toLocaleString()+'</span>'+
      '<span class="lv">'+T('stageUnit',{n:e.level})+'</span></div>';
  }).join('')+'</div>';
}
function qualifies(sc){
  if(sc<=0) return false;
  if(lbState==='offline') return true; /* 확인 불가 시 일단 등록 시도 */
  return lbCache.length<LB_MAX||sc>lbCache[lbCache.length-1].score;
}

  isBonus=isBonusLevel(lv);
  TRAY_MAX=trayMax(lv);
  document.body.classList.toggle('bonus',isBonus);
  $('bonusBar').classList.toggle('on',isBonus);

  if(isBonus){
    bonusCleared=0; bonusEarned=0; updateBonusHUD();
    $('stageName').textContent='BONUS · '+T('bonusName');
    const pos=assignBonusSymbols(buildBonusPositions());
    tiles=pos.map((p,i)=>({id:i,x:p.x,y:p.y,layer:0,sym:p.sym,where:'board',el:null,face:null}));
    timeLeft=BONUS_TIME;
  }else{
    if(!skipTransition) roundTransition(lv);
    else applyRoundColors(lv);
    $('stageName').textContent=stageName(lv);
    const pos=assignSymbols(buildPositions(lv),lv);
    tiles=pos.map((p,i)=>({id:i,x:p.x,y:p.y,layer:p.layer,sym:p.sym,where:'board',el:null,face:null}));
    timeLeft=levelTime(lv);
  }

  tray=[]; history=[]; clearing=false; playing=true; combo=0; lastMatchAt=0;
  $('comboWrap').classList.remove('on');
  $('hudLevel').textContent=isBonus?'★':lv;
  $('hudScore').textContent=score;
  drawBoard(); drawTray(-1); updateItems(); tick();
  startTimer();
  /* 첫 실행이면 튜토리얼 */
  if(lv===1 && !tutorDone) setTimeout(startTutor,420);
}
function tick(){
  $('hudTime').textContent=Math.floor(timeLeft/60)+':'+String(timeLeft%60).padStart(2,'0');
  $('timeStat').classList.toggle('warn',timeLeft<=30);
  syncBGM();
}
function saveBest(){
  if(level>best.level||(level===best.level&&score>best.score)){
    best={level:level,score:score};
    try{ localStorage.setItem('animaltile.best',JSON.stringify(best)); }catch(e){}
  }
}
function fireworks(){
  if(REDUCED) return;
  let n=0;
  const iv=setInterval(()=>{
    burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.25+Math.random()*.35),ANIMALS[(Math.random()*ANIMALS.length)|0]);
    if(++n>5) clearInterval(iv);
  },180);
}
/* 보너스 종료 — 실패 개념 없이 정산만 하고 다음 단계로 */
function bonusEnd(reason){
  playing=false; clearInterval(timerId);
  BGM.duck(2200);
  $('comboWrap').classList.remove('on');
  saveBest();

  if(level+1>progress.lv){ progress.lv=level+1; saveProgress(); }
  const allClear=tiles.every(t=>t.where==='gone');
  const clearBonus=allClear?1000+level*100:0;
  score+=clearBonus;
  saveBest();

  if(allClear){ sWin(); fireworks(); } else { sStage(); }
  confettiRain(60);
  const gotCoins=earnCoins(stageCoins(false,true)+(allClear?15:0));

  setTimeout(()=>{
    const nextLv=level+1;
    card.innerHTML=
      '<h2>'+(allClear?T('bonusAllClear'):T('bonusEndT'))+'</h2>'+
      '<p>'+reason+'</p>'+
      '<div class="bonusTotal"><b>+'+(bonusEarned+clearBonus).toLocaleString()+'</b><span>'+T('bonusEarned')+'</span></div>'+
      '<div class="tally">'+
        '<div class="tallyRow"><span class="lab">'+T('clearedSets')+'</span><span class="val">'+bonusCleared+'</span></div>'+
        '<div class="tallyRow"><span class="lab">'+T('rushScore',{n:BONUS_MULT})+'</span><span class="val">+'+bonusEarned.toLocaleString()+'</span></div>'+
        (allClear?'<div class="tallyRow"><span class="lab">'+T('allTidy')+'</span><span class="val">+'+clearBonus.toLocaleString()+'</span></div>':'')+
        '<div class="tallyRow total"><span class="lab">'+T('total')+'</span><span class="val">'+score.toLocaleString()+'</span></div>'+
      '</div>'+
      '<div class="earnRow"><span>'+T('gotCoins')+'</span><span class="v">🪙 +'+gotCoins+' ('+T('held',{n:coins.toLocaleString()})+')</span></div>'+
      mapHTML(nextLv)+
      '<div class="rewardRow">'+T('rewardUndo')+' <em>+1</em><span>·</span>'+T('rewardShuffle')+' <em>+1</em><span>·</span>'+T('rewardPull')+' <em>+1</em></div>';
    const b=document.createElement('button');
    b.className='btn'; b.textContent=T('toStage',{s:stageName(nextLv)});
    b.onclick=()=>{
      overlay.classList.remove('on');
      items.undo++; items.shuffle++; items.pull++;
      document.body.classList.remove('bonus');
      $('bonusBar').classList.remove('on');
      sStage();
      stageIntro(nextLv,()=>startLevel(nextLv,true));
    };
    card.appendChild(b);
    overlay.classList.add('on');
    setTimeout(()=>b.focus(),30);
  },1200);
}

/* 막 완주 결과 카드 — 계속하기 / 여기서 기록 남기기 선택 */
function showActCard(act,base,timeBonus,perfectBonus,completeBonus){
  const nextLv=level+1;
  card.innerHTML=
    '<h2>'+T('actComplete',{n:act})+'</h2>'+
    '<p>'+T('actReached',{n:ACT_LENGTH*act})+'</p>'+
    '<div class="actBadge">'+
      '<span class="big">'+actTitle(act)+'</span>'+
      '<span class="sm">'+T('titleGot')+'</span>'+
    '</div>'+
    '<div class="tally">'+
      '<div class="tallyRow"><span class="lab">'+T('baseScore')+'</span><span class="val">'+base.toLocaleString()+'</span></div>'+
      '<div class="tallyRow"><span class="lab">'+T('timeBonusL',{t:''})+'</span><span class="val">+'+timeBonus.toLocaleString()+'</span></div>'+
      (perfectBonus?'<div class="tallyRow"><span class="lab">'+T('clearPerfect')+'</span><span class="val">+'+perfectBonus.toLocaleString()+'</span></div>':'')+
      '<div class="tallyRow"><span class="lab">'+T('actBonus',{n:act})+'</span><span class="val">+'+completeBonus.toLocaleString()+'</span></div>'+
      '<div class="tallyRow total"><span class="lab">'+T('total')+'</span><span class="val">'+score.toLocaleString()+'</span></div>'+
    '</div>'+
    '<div class="earnRow"><span>'+T('actCoins')+'</span><span class="v">🪙 +'+(100+act*50)+' ('+T('held',{n:coins.toLocaleString()})+')</span></div>'+
    '<div class="actNext">'+T('actNextOpen',{n:act+1})+'</div>';

  const go=document.createElement('button');
  go.className='btn'; go.textContent=T('actContinue',{n:act+1});
  go.onclick=()=>{
    overlay.classList.remove('on');
    items={undo:5,shuffle:5,pull:3};   /* 새 막 시작 시 아이템 보충 */
    sStage();
    stageIntro(nextLv,()=>startLevel(nextLv,true));
  };
  card.appendChild(go);

  /* 여기서 멈추고 점수를 리더보드에 올리는 선택지 */
  const stop=document.createElement('button');
  stop.className='btn ghost'; stop.textContent=T('stopHere');
  stop.onclick=()=>{ overlay.classList.remove('on'); lose(T('actDone',{n:act})); };
  card.appendChild(stop);

  overlay.classList.add('on');
  setTimeout(()=>go.focus(),30);
}

function win(){
  playing=false; clearInterval(timerId);
  BGM.duck(2200);
  $('comboWrap').classList.remove('on');

  const gotStars=recordStage(level,timeLeft);
  const timeBonus=timeLeft*2;
  const perfect=(timeLeft>=levelTime(level)*0.5);  /* 절반 이상 남기면 완벽 클리어 */
  const perfectBonus=perfect?500+level*50:0;
  const base=score;
  score+=timeBonus+perfectBonus;
  saveBest();

  /* 1) 도장 + 빛 쓸기 + 폭죽 */
  stampClear(); sWin(); fireworks();

  /* 막의 마지막 단계(20, 40…)를 깼다면 엔딩 연출로 분기 */
  if(isActFinale(level)){
    const act=actOf(level);
    const completeBonus=3000+act*1000;
    score+=completeBonus;
    saveBest();
    if(act>actsCleared){
      actsCleared=act;
      try{ localStorage.setItem('animaltile.acts',String(actsCleared)); }catch(e){}
    }
    earnCoins(100+act*50);
    setTimeout(()=>{ sEnding(); endingSequence(act,()=>showActCard(act,base,timeBonus,perfectBonus,completeBonus)); },900);
    return;
  }

  /* 2) 1.3초 뒤 결과 집계 카드 */
  setTimeout(()=>{
    const nextLv=level+1;
    const nextIsBonus=isBonusLevel(nextLv);
    const nx=stageTier(nextLv);
    const rewards=perfect
      ?'<div class="rewardRow">'+T('rewardUndo')+' <em>+2</em><span>·</span>'+T('rewardShuffle')+' <em>+2</em><span>·</span>'+T('rewardPull')+' <em>+1</em></div>'
      :'<div class="rewardRow">'+T('rewardUndo')+' <em>+1</em><span>·</span>'+T('rewardShuffle')+' <em>+1</em></div>';
    const gotCoins=earnCoins(stageCoins(perfect,false));
    card.innerHTML=
      '<h2>'+(perfect?T('clearPerfect'):T('clearNormal',{n:level}))+'</h2>'+
      '<p>'+stageName(level)+'</p>'+
      '<div class="progStars" style="justify-content:center;font-size:26px;margin-bottom:12px">'+
        [1,2,3].map(i=>'<span class="s'+(i<=gotStars?' on':'')+'">★</span>').join('')+'</div>'+
      '<div class="tally">'+
        '<div class="tallyRow"><span class="lab">'+T('baseScore')+'</span><span class="val">'+base.toLocaleString()+'</span></div>'+
        '<div class="tallyRow"><span class="lab">'+T('timeBonusL',{t:Math.floor(timeLeft/60)+':'+String(timeLeft%60).padStart(2,'0')})+'</span><span class="val">+'+timeBonus.toLocaleString()+'</span></div>'+
        (perfect?'<div class="tallyRow"><span class="lab">'+T('perfectBonusL')+'</span><span class="val">+'+perfectBonus.toLocaleString()+'</span></div>':'')+
        '<div class="tallyRow total"><span class="lab">'+T('total')+'</span><span class="val">'+score.toLocaleString()+'</span></div>'+
      '</div>'+
      '<div class="earnRow"><span>'+T('gotCoins')+'</span><span class="v">🪙 +'+gotCoins+' ('+T('held',{n:coins.toLocaleString()})+')</span></div>'+
      rewards+
      mapHTML(nextLv)+
      (nextIsBonus
        ? '<div class="bonusTotal"><b>🌟 BONUS</b><span>'+T('bonusNext',{n:BONUS_MULT})+'</span></div>'
        : '<div class="nextInfo">'+
            '<div><b>'+nextLv+'</b><span>'+T('nextStage')+'</span></div>'+
            '<div><b>'+nx.layers+'</b><span>'+T('layers')+'</span></div>'+
            '<div><b>'+nx.kinds+'</b><span>'+T('kinds')+'</span></div>'+
          '</div>');
    const b=document.createElement('button');
    b.className='btn'; b.textContent=nextIsBonus?T('bonusName'):T('toStage',{s:stageName(nextLv)});
    b.onclick=()=>{
      overlay.classList.remove('on');
      if(perfect){ items.undo+=2; items.shuffle+=2; items.pull+=1; }
      else { items.undo++; items.shuffle++; }
      if(nextIsBonus){
        sBonus();
        bonusIntro(()=>startLevel(nextLv,true));
      }else{
        sStage();
        stageIntro(nextLv,()=>startLevel(nextLv,true));
      }
    };
    card.appendChild(b);
    overlay.classList.add('on');
    setTimeout(()=>b.focus(),30);
  },1300);
}
function lose(reason){
  playing=false;
  clearInterval(timerId);
  clearInterval(reviveTimer);
  BGM.duck(2000);
  $('comboWrap').classList.remove('on');

  /* 부활 조건:
     - 보너스 스테이지 제외
     - 판당 최대 2회 (revivesUsed가 이미 2면 불가)
     - 코인이 부활 비용 이상일 때만 */
  const canRevive = !isBonus && revivesUsed < 2 && coins >= reviveCost();
  if(canRevive){
    sLose();
    offerRevive(reason, ()=>finalLose(reason));
    return;
  }
  finalLose(reason);
}

function finalLose(reason){
  playing=false; clearInterval(timerId); clearInterval(reviveTimer);
  saveBest(); sLose(); BGM.stop();
  $('comboWrap').classList.remove('on');

  if(qualifies(score)){
    let lastName=''; try{ lastName=localStorage.getItem('animaltile.name')||''; }catch(e){}
    card.innerHTML='<h2>'+T('newRecord')+'</h2><p>'+reason+'<br>'+T('stageUnit',{n:level})+' · <b>'+score.toLocaleString()+'</b><br>'+T('willRank')+'</p>';
    const row=document.createElement('div'); row.className='nameRow';
    const inp=document.createElement('input');
    inp.type='text'; inp.maxLength=12; inp.placeholder=T('namePlace'); inp.value=lastName;
    const sv=document.createElement('button'); sv.textContent=T('submit');
    row.appendChild(inp); row.appendChild(sv); card.appendChild(row);

    const skip=document.createElement('button');
    skip.className='btn ghost'; skip.textContent=T('skipReg');
    skip.onclick=()=>{ overlay.classList.remove('on'); restart(); };

    const submit=async()=>{
      sv.disabled=true; sv.textContent=T('submitting');
      const nm=inp.value.trim()||T('anon');
      try{ localStorage.setItem('animaltile.name',nm); }catch(e){}
      try{
        const res=await postLB(nm,score,level);
        await fetchLB();
        card.innerHTML='<h2>'+(res.rank<=3?'🏆 ':'')+T('rankedAt',{n:res.rank})+'</h2>'+
          '<p>'+escapeHTML(nm)+' · '+score.toLocaleString()+T('pts')+'</p>'+lbHTML(res.entry.id);
        if(res.rank<=3){ confettiRain(70); sWin(); }
      }catch(e){
        card.innerHTML='<h2>'+T('regFail')+'</h2><p>'+T('regFailMsg',{n:score.toLocaleString()})+'</p>';
      }
      const b=document.createElement('button');
      b.className='btn'; b.textContent=T('playAgain');
      b.onclick=()=>{ overlay.classList.remove('on'); restart(); };
      card.appendChild(b);
      const h2=document.createElement('button');
      h2.className='btn ghost'; h2.textContent=T('home');
      h2.onclick=()=>{ overlay.classList.remove('on'); openHome(); };
      card.appendChild(h2);
      setTimeout(()=>b.focus(),30);
    };
    sv.onclick=submit;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
    card.appendChild(skip);
    overlay.classList.add('on');
    setTimeout(()=>inp.focus(),50);
    return;
  }

  const gap=lbCache.length>=LB_MAX?T('shortBy',{m:LB_MAX,n:(lbCache[LB_MAX-1].score-score).toLocaleString()}):'';
  show(T('gameOver'),reason+'<br>'+T('stageUnit',{n:level})+' · <b>'+score.toLocaleString()+'</b>'+gap,
    T('playAgain'),restart,false);
  const hb=document.createElement('button');
  hb.className='btn ghost'; hb.textContent=T('home');
  hb.onclick=()=>{ overlay.classList.remove('on'); openHome(); };
  card.appendChild(hb);
}
function restart(){
  score=0; combo=0; lastMatchAt=0; revivesUsed=0;
  clearInterval(reviveTimer);
  closeHome();
  isBonus=false; bonusCleared=0; bonusEarned=0;
  document.body.classList.remove('bonus');
  $('bonusBar').classList.remove('on');
  items={undo:3,shuffle:3,pull:1};
  startLevel(1);
}
function show(title,body,btnText,onClick,withPicker){
  card.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>';
  if(withPicker){
    const wrap=document.createElement('div'); wrap.className='pick';
    [['sky',T('themeSky'),'linear-gradient(140deg,#EAF4FD,#8FBADD)'],
     ['meadow',T('themeMeadow'),'linear-gradient(140deg,#F3FAE9,#A9D398)'],
     ['moon',T('themeMoon'),'linear-gradient(140deg,#33507E,#0B1220)']].forEach(function(o){
      const b=document.createElement('button');
      b.dataset.t=o[0]; b.innerHTML='<i style="background:'+o[2]+'"></i>'+o[1];
      b.onclick=()=>setTheme(o[0]);
      wrap.appendChild(b);
    });
    card.appendChild(wrap); setTheme(document.body.dataset.theme);
  }
  const b=document.createElement('button');
  b.className='btn'; b.textContent=btnText;
  b.onclick=()=>{ overlay.classList.remove('on'); ac(); onClick(); };
  card.appendChild(b);
  overlay.classList.add('on');
  setTimeout(()=>b.focus(),30);
}

$('btnUndo').onclick=useUndo;
$('btnShuffle').onclick=useShuffle;
$('btnPull').onclick=usePull;

/* 첫 진입 — 언어 적용 후 홈 화면 */
document.documentElement.lang=LANG;
applyStaticText();
openHome();
})();
</script>
