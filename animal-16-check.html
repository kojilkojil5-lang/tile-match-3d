<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동물 16종 검수</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 14px;background:radial-gradient(120% 80% at 50% 0%,#EAF4FD,#B7D5EE 55%,#8FBADD);
font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:#22384E}
.wrap{max-width:840px;margin:0 auto}
h1{font-family:'Gowun Batang',serif;font-size:19px;margin:0 0 16px}
h2{font-family:'Gowun Batang',serif;font-size:13.5px;margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid #7BA6CC55}
.note{font-size:11.5px;color:#5E7C97;margin:0 0 10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:11px}
.cell{text-align:center}
.cell span{display:block;font-size:10px;color:#5E7C97;margin-top:4px}
.tile{width:54px;height:62px;border-radius:9px;border:1px solid #2A211826;margin:0 auto;
background:linear-gradient(168deg,#FFFDF6 0%,#F3E6CB 100%);
box-shadow:0 4px 0 #CFA96F,0 5px 9px #0000004d,inset 0 1px 0 #ffffffb3;
display:flex;align-items:center;justify-content:center;position:relative}
.tile::after{content:"";position:absolute;inset:1px;border-radius:8px;
background:linear-gradient(122deg,#ffffff8c 0 16%,transparent 40%);opacity:.55}
.tile svg{width:38px;height:38px;position:relative;z-index:1;display:block}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.row.tiny svg{width:22px;height:22px}
.row.silh svg{width:40px;height:40px;filter:grayscale(1) contrast(1.75)}
.dark{background:#16243A;padding:11px;border-radius:11px;display:flex;gap:7px;flex-wrap:wrap}
.dark .tile{background:linear-gradient(168deg,#FBF3E0,#DFCCA5);box-shadow:0 4px 0 #B08F4E,0 5px 9px #0006}
.gold{background:#E8A93C;padding:11px;border-radius:11px;display:flex;gap:7px;flex-wrap:wrap}
.gold .tile{background:linear-gradient(168deg,#FFFBEB 0%,#FFE9A8 55%,#F5CE6A 100%);box-shadow:0 4px 0 #C98F2E,0 5px 12px #00000047}
</style></head><body>
